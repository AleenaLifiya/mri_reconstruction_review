<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 322 2102" width="322" height="2102" role="img" font-family="Helvetica, 'Nimbus Sans', Arial, sans-serif"><title>Graphical abstract of the review</title><rect width="322" height="2102" fill="#ffffff"/><text x="161.0" y="24" font-size="18" font-weight="700" text-anchor="middle" fill="#000000">Putting the Slices Together</text><text x="161.0" y="45" font-size="13" font-weight="400" text-anchor="middle" fill="#373737">MRI reconstruction, 183 studies, 2020 to 2026</text><g transform="translate(6,62)"><rect x="0" y="0" width="310" height="486" rx="2" fill="#ffffff" stroke="#373737" stroke-width="0.9"/><path d="M2 0H308a2 2 0 0 1 2 2V42H0V2a2 2 0 0 1 2-2z" fill="#DBEBF4" stroke="#373737" stroke-width="0.9"/><text x="14" y="27" font-size="15" font-weight="700" text-anchor="start" fill="#000000">1  Short scans lose slices</text><text x="16" y="68" font-size="12.5" font-weight="400" text-anchor="start" fill="#373737">Clinical protocols shorten scans by</text><text x="16" y="85" font-size="12.5" font-weight="400" text-anchor="start" fill="#373737">undersampling or acquiring thick,</text><text x="16" y="102" font-size="12.5" font-weight="400" text-anchor="start" fill="#373737">widely spaced slices.</text><polygon points="23,136 84,136 71,154 10,154" fill="#B3D5E8" stroke="#373737" stroke-width="0.6"/><polygon points="23,149 84,149 71,167 10,167" fill="#B3D5E8" stroke="#373737" stroke-width="0.6"/><polygon points="23,162 84,162 71,180 10,180" fill="#B3D5E8" stroke="#373737" stroke-width="0.6"/><polygon points="23,175 84,175 71,193 10,193" fill="#B3D5E8" stroke="#373737" stroke-width="0.6"/><polygon points="23,188 84,188 71,206 10,206" fill="#B3D5E8" stroke="#373737" stroke-width="0.6"/><polygon points="23,201 84,201 71,219 10,219" fill="#B3D5E8" stroke="#373737" stroke-width="0.6"/><polygon points="23,214 84,214 71,232 10,232" fill="#B3D5E8" stroke="#373737" stroke-width="0.6"/><polygon points="23,227 84,227 71,245 10,245" fill="#B3D5E8" stroke="#373737" stroke-width="0.6"/><polygon points="23,240 84,240 71,258 10,258" fill="#B3D5E8" stroke="#373737" stroke-width="0.6"/><polygon points="129,136 190,136 177,154 116,154" fill="#338EC1" stroke="#373737" stroke-width="0.6"/><polygon points="129,149 190,149 177,167 116,167" fill="#ffffff" stroke="#9B9B9B" stroke-width="0.8" stroke-dasharray="3 2"/><polygon points="129,162 190,162 177,180 116,180" fill="#ffffff" stroke="#9B9B9B" stroke-width="0.8" stroke-dasharray="3 2"/><polygon points="129,175 190,175 177,193 116,193" fill="#ffffff" stroke="#9B9B9B" stroke-width="0.8" stroke-dasharray="3 2"/><polygon points="129,188 190,188 177,206 116,206" fill="#338EC1" stroke="#373737" stroke-width="0.6"/><polygon points="129,201 190,201 177,219 116,219" fill="#ffffff" stroke="#9B9B9B" stroke-width="0.8" stroke-dasharray="3 2"/><polygon points="129,214 190,214 177,232 116,232" fill="#ffffff" stroke="#9B9B9B" stroke-width="0.8" stroke-dasharray="3 2"/><polygon points="129,227 190,227 177,245 116,245" fill="#ffffff" stroke="#9B9B9B" stroke-width="0.8" stroke-dasharray="3 2"/><polygon points="129,240 190,240 177,258 116,258" fill="#338EC1" stroke="#373737" stroke-width="0.6"/><polygon points="235,136 296,136 283,154 222,154" fill="#338EC1" stroke="#373737" stroke-width="0.6"/><polygon points="235,149 296,149 283,167 222,167" fill="#33B18F" stroke="#373737" stroke-width="0.6"/><polygon points="235,162 296,162 283,180 222,180" fill="#33B18F" stroke="#373737" stroke-width="0.6"/><polygon points="235,175 296,175 283,193 222,193" fill="#33B18F" stroke="#373737" stroke-width="0.6"/><polygon points="235,188 296,188 283,206 222,206" fill="#338EC1" stroke="#373737" stroke-width="0.6"/><polygon points="235,201 296,201 283,219 222,219" fill="#33B18F" stroke="#373737" stroke-width="0.6"/><polygon points="235,214 296,214 283,232 222,232" fill="#33B18F" stroke="#373737" stroke-width="0.6"/><polygon points="235,227 296,227 283,245 222,245" fill="#33B18F" stroke="#373737" stroke-width="0.6"/><polygon points="235,240 296,240 283,258 222,258" fill="#338EC1" stroke="#373737" stroke-width="0.6"/><line x1="88" y1="198" x2="107" y2="198" stroke="#373737" stroke-width="1.1"/><polygon points="112,198 105,194 105,202" fill="#373737"/><line x1="194" y1="198" x2="213" y2="198" stroke="#373737" stroke-width="1.1"/><polygon points="218,198 211,194 211,202" fill="#373737"/><text x="47" y="282" font-size="11" font-weight="700" text-anchor="middle" fill="#373737">Dense volume</text><text x="47" y="297" font-size="11.5" font-weight="400" text-anchor="middle" fill="#373737" font-style="italic">Y</text><text x="153" y="282" font-size="11" font-weight="700" text-anchor="middle" fill="#373737">Short scan</text><text x="153" y="297" font-size="11.5" font-weight="400" text-anchor="middle" fill="#373737" font-style="italic">X</text><text x="259" y="282" font-size="11" font-weight="700" text-anchor="middle" fill="#373737">Reconstruction</text><text x="259" y="297" font-size="11.5" font-weight="400" text-anchor="middle" fill="#373737" font-style="italic">Ŷ = f(X)</text><rect x="18" y="322" width="20" height="10" rx="0" fill="#338EC1" stroke="#373737" stroke-width="0.6"/><text x="45" y="331.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#373737">acquired slice</text><rect x="18" y="341" width="20" height="10" rx="0" fill="#ffffff" stroke="#9B9B9B" stroke-width="0.8" stroke-dasharray="3 2"/><text x="45" y="350.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#373737">tissue never measured</text><rect x="18" y="360" width="20" height="10" rx="0" fill="#33B18F" stroke="#373737" stroke-width="0.6"/><text x="45" y="369.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#373737">slice estimated by a model</text><rect x="14" y="392" width="282" height="78" rx="2" fill="#DBF1EB" stroke="#373737" stroke-width="0.9"/><text x="26" y="415" font-size="12.3" font-weight="400" text-anchor="start" fill="#373737">Every slice at an unacquired</text><text x="26" y="432" font-size="12.3" font-weight="400" text-anchor="start" fill="#373737">position is an estimate, and it needs</text><text x="26" y="449" font-size="12.3" font-weight="400" text-anchor="start" fill="#373737">evidence before clinical use.</text></g><polygon points="150.0,553 172.0,553 161.0,573" fill="#373737"/><g transform="translate(6,578)"><rect x="0" y="0" width="310" height="486" rx="2" fill="#ffffff" stroke="#373737" stroke-width="0.9"/><path d="M2 0H308a2 2 0 0 1 2 2V42H0V2a2 2 0 0 1 2-2z" fill="#DAEFFA" stroke="#373737" stroke-width="0.9"/><text x="14" y="27" font-size="15" font-weight="700" text-anchor="start" fill="#000000">2  What the review covers</text><text x="16" y="104" font-size="46" font-weight="700" text-anchor="start" fill="#000000">183</text><text x="112" y="80" font-size="12.5" font-weight="400" text-anchor="start" fill="#373737">studies from</text><text x="112" y="96" font-size="12.5" font-weight="400" text-anchor="start" fill="#373737">456 records,</text><text x="112" y="112" font-size="12.5" font-weight="400" text-anchor="start" fill="#373737">2020 to 2026</text><rect x="14" y="128" width="90" height="54" rx="2" fill="#F0F0F0" stroke="#373737" stroke-width="0.9"/><text x="59" y="153" font-size="20" font-weight="700" text-anchor="middle" fill="#000000">6</text><text x="59" y="171" font-size="11" font-weight="400" text-anchor="middle" fill="#373737">settings</text><rect x="110" y="128" width="90" height="54" rx="2" fill="#F0F0F0" stroke="#373737" stroke-width="0.9"/><text x="155" y="153" font-size="20" font-weight="700" text-anchor="middle" fill="#000000">40</text><text x="155" y="171" font-size="11" font-weight="400" text-anchor="middle" fill="#373737">datasets</text><rect x="206" y="128" width="90" height="54" rx="2" fill="#F0F0F0" stroke="#373737" stroke-width="0.9"/><text x="251" y="153" font-size="20" font-weight="700" text-anchor="middle" fill="#000000">7</text><text x="251" y="171" font-size="11" font-weight="400" text-anchor="middle" fill="#373737">DL families</text><text x="16" y="206" font-size="12.5" font-weight="700" text-anchor="start" fill="#373737">Six reconstruction settings</text><rect x="14" y="216" width="282" height="78" rx="2" fill="#DBEBF4" stroke="#373737" stroke-width="0.9"/><text x="24" y="234" font-size="11.5" font-weight="700" text-anchor="start" fill="#373737">Through-plane</text><text x="38" y="252" font-size="12" font-weight="400" text-anchor="start" fill="#373737">Sparse-to-dense</text><text x="38" y="267" font-size="12" font-weight="400" text-anchor="start" fill="#373737">Thick-to-thin</text><text x="38" y="282" font-size="12" font-weight="400" text-anchor="start" fill="#373737">Slice-to-volume</text><rect x="14" y="301" width="282" height="66" rx="2" fill="#F0F0F0" stroke="#373737" stroke-width="0.9"/><text x="38" y="321" font-size="12" font-weight="400" text-anchor="start" fill="#373737">In-plane super-resolution</text><text x="38" y="337" font-size="12" font-weight="400" text-anchor="start" fill="#373737">Accelerated acquisition</text><text x="38" y="353" font-size="12" font-weight="400" text-anchor="start" fill="#373737">Isotropic 3D</text><text x="16" y="386" font-size="12.5" font-weight="700" text-anchor="start" fill="#373737">Each study is read for</text><text x="16" y="405" font-size="12.3" font-weight="400" text-anchor="start" fill="#373737">data and cohorts, reported scores,</text><text x="16" y="422" font-size="12.3" font-weight="400" text-anchor="start" fill="#373737">validation beyond image quality,</text><text x="16" y="439" font-size="12.3" font-weight="400" text-anchor="start" fill="#373737">computational cost and code.</text></g><polygon points="150.0,1069 172.0,1069 161.0,1089" fill="#373737"/><g transform="translate(6,1094)"><rect x="0" y="0" width="310" height="486" rx="2" fill="#ffffff" stroke="#373737" stroke-width="0.9"/><path d="M2 0H308a2 2 0 0 1 2 2V42H0V2a2 2 0 0 1 2-2z" fill="#FAECCC" stroke="#373737" stroke-width="0.9"/><text x="14" y="27" font-size="15" font-weight="700" text-anchor="start" fill="#000000">3  What the evidence shows</text><text x="16" y="66" font-size="12.5" font-weight="700" text-anchor="start" fill="#373737">Studies per setting</text><text x="132" y="89" font-size="11.3" font-weight="400" text-anchor="end" fill="#373737">In-plane SR</text><rect x="138" y="79" width="128.0" height="12" fill="#9B9B9B" stroke="#373737" stroke-width="0.4"/><text x="271.0" y="89.5" font-size="11.5" font-weight="700" text-anchor="start" fill="#373737">92</text><text x="132" y="111" font-size="11.3" font-weight="400" text-anchor="end" fill="#373737">Accelerated</text><rect x="138" y="101" width="65.4" height="12" fill="#9B9B9B" stroke="#373737" stroke-width="0.4"/><text x="208.39130434782606" y="111.5" font-size="11.5" font-weight="700" text-anchor="start" fill="#373737">47</text><text x="132" y="133" font-size="11.3" font-weight="400" text-anchor="end" fill="#373737">Through-plane</text><rect x="138" y="123" width="47.3" height="12" fill="#338EC1" stroke="#373737" stroke-width="0.4"/><text x="190.30434782608694" y="133.5" font-size="11.5" font-weight="700" text-anchor="start" fill="#373737">34</text><line x1="138" y1="76" x2="138" y2="141" stroke="#373737" stroke-width="0.8"/><text x="16" y="162" font-size="12.5" font-weight="700" text-anchor="start" fill="#373737">Data and reporting</text><text x="132" y="185" font-size="11.3" font-weight="400" text-anchor="end" fill="#373737">Release code</text><rect x="138" y="175" width="80.7" height="12" fill="#9B9B9B" stroke="#373737" stroke-width="0.4"/><text x="223.69565217391306" y="185.5" font-size="11.5" font-weight="700" text-anchor="start" fill="#373737">58</text><text x="132" y="207" font-size="11.3" font-weight="400" text-anchor="end" fill="#373737">Real degraded input</text><rect x="138" y="197" width="43.1" height="12" fill="#338EC1" stroke="#373737" stroke-width="0.4"/><text x="186.1304347826087" y="207.5" font-size="11.5" font-weight="700" text-anchor="start" fill="#373737">31</text><text x="132" y="229" font-size="11.3" font-weight="400" text-anchor="end" fill="#373737">Report cost</text><rect x="138" y="219" width="41.7" height="12" fill="#9B9B9B" stroke="#373737" stroke-width="0.4"/><text x="184.73913043478262" y="229.5" font-size="11.5" font-weight="700" text-anchor="start" fill="#373737">30</text><line x1="138" y1="172" x2="138" y2="237" stroke="#373737" stroke-width="0.8"/><text x="16" y="258" font-size="12.5" font-weight="700" text-anchor="start" fill="#373737">Beyond image quality</text><text x="132" y="281" font-size="11.3" font-weight="400" text-anchor="end" fill="#373737">Downstream task</text><rect x="138" y="271" width="15.3" height="12" fill="#33B18F" stroke="#373737" stroke-width="0.4"/><text x="158.30434782608697" y="281.5" font-size="11.5" font-weight="700" text-anchor="start" fill="#373737">11</text><text x="132" y="303" font-size="11.3" font-weight="400" text-anchor="end" fill="#373737">Uncertainty</text><rect x="138" y="293" width="9.7" height="12" fill="#33B18F" stroke="#373737" stroke-width="0.4"/><text x="152.73913043478262" y="303.5" font-size="11.5" font-weight="700" text-anchor="start" fill="#373737">7</text><text x="132" y="325" font-size="11.3" font-weight="400" text-anchor="end" fill="#373737">Anatomical measure</text><rect x="138" y="315" width="9.7" height="12" fill="#33B18F" stroke="#373737" stroke-width="0.4"/><text x="152.73913043478262" y="325.5" font-size="11.5" font-weight="700" text-anchor="start" fill="#373737">7</text><text x="132" y="347" font-size="11.3" font-weight="400" text-anchor="end" fill="#373737">Reader study</text><rect x="138" y="337" width="4.2" height="12" fill="#33B18F" stroke="#373737" stroke-width="0.4"/><text x="147.17391304347825" y="347.5" font-size="11.5" font-weight="700" text-anchor="start" fill="#373737">3</text><line x1="138" y1="268" x2="138" y2="355" stroke="#373737" stroke-width="0.8"/><text x="16" y="473" font-size="11" font-weight="400" text-anchor="start" fill="#4a4a4a">Number of the 183 reviewed works</text></g><polygon points="150.0,1585 172.0,1585 161.0,1605" fill="#373737"/><g transform="translate(6,1610)"><rect x="0" y="0" width="310" height="486" rx="2" fill="#ffffff" stroke="#373737" stroke-width="0.9"/><path d="M2 0H308a2 2 0 0 1 2 2V42H0V2a2 2 0 0 1 2-2z" fill="#DBF1EB" stroke="#373737" stroke-width="0.9"/><text x="14" y="27" font-size="15" font-weight="700" text-anchor="start" fill="#000000">4  What would move the field</text><circle cx="28" cy="72" r="11" fill="#338EC1" stroke="#373737" stroke-width="0.6"/><text x="28" y="76.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">1</text><text x="48" y="76.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#373737">Shared benchmarks with real</text><text x="48" y="92.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#373737">paired acquisitions</text><circle cx="28" cy="138.0" r="11" fill="#338EC1" stroke="#373737" stroke-width="0.6"/><text x="28" y="142.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><text x="48" y="142.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#373737">Evaluation that counts missed and</text><text x="48" y="158.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#373737">false findings for the clinical question</text><circle cx="28" cy="204.0" r="11" fill="#338EC1" stroke="#373737" stroke-width="0.6"/><text x="28" y="208.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><text x="48" y="208.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#373737">Reconstructions with calibrated</text><text x="48" y="224.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#373737">confidence, checkable without a</text><text x="48" y="241.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#373737">reference</text><circle cx="28" cy="286.5" r="11" fill="#338EC1" stroke="#373737" stroke-width="0.6"/><text x="28" y="291.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">4</text><text x="48" y="290.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#373737">Complete reporting, including</text><text x="48" y="307.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#373737">end-to-end time on stated hardware</text><rect x="14" y="360.5" width="282" height="111.5" rx="2" fill="#F0F0F0" stroke="#373737" stroke-width="0.9"/><text x="26" y="383.5" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Reporting checklist</text><text x="26" y="404.5" font-size="11.8" font-weight="400" text-anchor="start" fill="#373737">setting, degraded input, data,</text><text x="26" y="421.0" font-size="11.8" font-weight="400" text-anchor="start" fill="#373737">image quality, validation, uncertainty,</text><text x="26" y="437.5" font-size="11.8" font-weight="400" text-anchor="start" fill="#373737">computational cost, reproducibility</text></g></svg>
